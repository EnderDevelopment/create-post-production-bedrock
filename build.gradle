plugins {
    id 'fabric-loom' version '1.1-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }
}

extra {
    apply plugin: 'fabric-loom'
    minecraft {
        version = project.property('minecraft_version')
        mappings = 'official'
        runs {
            client {
                property 'fabric.development'
            }
            server {
                property 'fabric.development'
            }
        }
    }
    loom {
        accessWidenerPath = project.file('src/main/resources/accesswidener.txt').absolutePath
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:${project.property('minecraft_version')}'
    mappings 'net.fabricmc:yarn:${project.property('minecraft_version')}:v2'
    modImplementation 'net.fabricmc:fabric-loader:${project.property('loader_version')}'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.76.0+1.20.1'
}

processResources {
    inputs.property 'version', project.property('mod_version')
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}